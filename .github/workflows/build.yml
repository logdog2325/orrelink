name: Build XD Netplay

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Also build the Windows desktop client"
        type: boolean
        default: false
      build_macos:
        description: "Also build the macOS (arm64) desktop client"
        type: boolean
        default: false
      build_linux:
        description: "Also build the Linux (x86_64) desktop client"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # dolphin-emu/dolphin master as of 2026-07-23 (includes Android netplay, PR 14647)
  BASE_SHA: d6e803e63d7a809fcafb4e39c79bdf4aabb49c79
  # PR 14745 "Android: add dual-screen Wii pointer and GBA support" head
  PR_SHA: 6ea62d8b29ba22e0e2cdc88b4359334a875b6224

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.mk.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - name: Construct xd-netplay branch
        id: mk
        run: |
          set -eux
          git clone --single-branch --branch master https://github.com/dolphin-emu/dolphin.git dolphin
          cd dolphin
          git config user.name "logdog2325"
          git config user.email "loganjayfisher@gmail.com"
          git fetch origin refs/pull/14745/head:pr-14745
          git checkout -b xd-netplay "$BASE_SHA"
          if git cat-file -e "$PR_SHA^{commit}" 2>/dev/null; then
            MERGE_REF="$PR_SHA"
          else
            MERGE_REF="pr-14745"
            echo "::warning::Pinned PR 14745 SHA is gone (force push upstream); using current head"
          fi
          git merge --no-edit "$MERGE_REF"
          git am ../ci/patches/*.patch
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git remote add mine "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Retry: a cancelled or overlapping run leaves refs/heads/xd-netplay at a value this
          # push did not expect, and the server rejects it as a stale lock. The branch is rebuilt
          # from scratch every run, so re-fetching and overwriting is always the right answer.
          for attempt in 1 2 3; do
            if git push -f mine xd-netplay; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Could not publish xd-netplay."; exit 1; fi
            echo "push rejected (attempt $attempt), refetching"
            git fetch mine xd-netplay || true
            sleep 5
          done
          if [ -n "$TAG" ]; then git push -f mine "refs/tags/$TAG"; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.15729638" > /dev/null
      - name: Pre-copy Sys assets
        run: |
          mkdir -p Source/Android/app/src/main/assets
          rm -rf Source/Android/app/src/main/assets/Sys
          cp -r Data/Sys Source/Android/app/src/main/assets/Sys
          rm -rf Source/Android/app/src/main/assets/Sys/Themes
      # Every APK users install must carry the SAME signature, or Android refuses to install the
      # new build over the old app and they have to uninstall -- which deletes their team saves.
      # Without this the runner's throwaway debug keystore signs each build with a different key.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set; refusing to ship an unsignable APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          # Fail here, in seconds, rather than after the native build: an unreadable keystore is
          # otherwise only discovered at the packaging step at the very end of the job.
          keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" > /dev/null
          echo "keystore=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
      - name: Build APK
        working-directory: Source/Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew assembleDebug --no-daemon \
            -Pkeystore="${{ steps.signing.outputs.keystore }}" \
            -Pstorepass="$KEYSTORE_PASSWORD" \
            -Pkeyalias="$KEY_ALIAS" \
            -Pkeypass="$KEYSTORE_PASSWORD" \
            -Pstoretype=PKCS12
      - name: Confirm the APK carries the expected signature
        env:
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          apk="$(ls Source/Android/app/build/outputs/apk/debug/*.apk | head -1)"
          # Runners carry several build-tools versions, so this must resolve to exactly one
          # apksigner -- an unquoted glob passes the others along as arguments.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          # awk over grep: no match is an empty result to report, not a pipeline failure that
          # reads like the signature itself was wrong.
          signer="$("$apksigner" verify --print-certs "$apk" \
            | awk '/SHA-256 digest/ { print $NF; exit }')"
          if [ -z "$signer" ]; then
            echo "::error::Could not read the APK's signer certificate."
            exit 1
          fi
          echo "signer SHA-256: $signer"
          if [ -n "${EXPECTED_SIGNER:-}" ] && [ "$signer" != "$EXPECTED_SIGNER" ]; then
            echo "::error::Signer changed ($signer, expected $EXPECTED_SIGNER) -- users could not"
            echo "::error::update over their existing install without uninstalling first."
            exit 1
          fi
      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk="$(ls Source/Android/app/build/outputs/apk/debug/*.apk | head -1)"
          entries="$(unzip -Z1 "$apk")"
          for f in \
            lib/arm64-v8a/libmain.so \
            assets/Sys/GBA/gba_bios.bin \
            assets/Sys/GameSettings/GXXE01.ini \
            assets/xdnetplay/gen3data.json \
            assets/xdnetplay/EMERALD-2.sav \
            assets/xdnetplay/EMERALD-3.sav; do
            grep -qx "$f" <<< "$entries" || { echo "APK missing $f" >&2; exit 1; }
          done
          wrong="$(awk -F/ '/^lib\//{print $2}' <<< "$entries" | sort -u | grep -vx arm64-v8a || true)"
          if [ -n "$wrong" ]; then echo "unexpected ABI(s): $wrong" >&2; exit 1; fi
          echo "APK contents OK"
      - name: Collect native symbols
        # AGP strips every packaged .so (no keepDebugSymbols), so the APK's libmain.so has no
        # .symtab and a crash dump cannot be read. Keep the pre-strip copy (same BuildId) as its
        # own artifact: unzip it, then llvm-symbolizer --obj=libmain.so -f -C -i -p <pcs>.
        run: |
          set -euo pipefail
          readelf="$(find "$ANDROID_HOME/ndk" -path '*/prebuilt/linux-x86_64/bin/llvm-readelf' | sort -V | tail -1)"
          sym="Source/Android/app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/arm64-v8a/libmain.so"
          if [ ! -f "$sym" ]; then
            sym="$(find Source/Android/app/build/intermediates -path '*/arm64-v8a/libmain.so' -print0 | xargs -0 ls -S | head -1)"
          fi
          # To a file first: grep -q quits at its first match, readelf then dies of SIGPIPE, and
          # pipefail turned that into a false "stripped" whenever .symtab came early enough.
          "$readelf" -S "$sym" > "$RUNNER_TEMP/sections.txt"
          grep -q ' \.symtab' "$RUNNER_TEMP/sections.txt" || { echo "::error::$sym is stripped"; exit 1; }
          mkdir -p symbols/arm64-v8a
          cp "$sym" symbols/arm64-v8a/libmain.so
          "$readelf" -n symbols/arm64-v8a/libmain.so | awk '/Build ID/ {print $NF}' > symbols/BuildId.txt
          apk="$(ls Source/Android/app/build/outputs/apk/debug/*.apk | head -1)"
          unzip -p "$apk" lib/arm64-v8a/libmain.so > "$RUNNER_TEMP/packaged-libmain.so"
          "$readelf" -n "$RUNNER_TEMP/packaged-libmain.so" | awk '/Build ID/ {print $NF}' > symbols/BuildId.apk.txt
          diff symbols/BuildId.txt symbols/BuildId.apk.txt
          git rev-parse HEAD > symbols/COMMIT
          ls -la symbols symbols/arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-android-symbols
          path: symbols/
          compression-level: 9
          retention-days: 90
      - name: Rename APK
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p out
          cp Source/Android/app/build/outputs/apk/debug/*.apk "out/dolphin-xd-netplay-${SHORT_SHA}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-apk
          path: out/*.apk

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_windows }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Source/dolphin-emu.sln /m /v:m /p:Configuration=Release /p:Platform=x64
      - name: Collect symbols
        # crash_*.txt (written next to the session logs when OrreLink dies) lists
        # frames as OrreLink.exe+0xOFFSET. The linker map turns an offset into a
        # function by hand (Rva+Base column minus the preferred base 0x140000000);
        # the PDB does it with any Windows debugger. Neither ships in the zip.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p symbols
          pdb="$(find Build -name 'OrreLink.pdb' | head -1)"
          map="$(find Build -name 'OrreLink.map' | head -1)"
          [ -n "$pdb" ] || { echo "::error::OrreLink.pdb not produced"; exit 1; }
          [ -n "$map" ] || { echo "::error::OrreLink.map not produced"; exit 1; }
          cp "$pdb" "$map" symbols/
          git rev-parse HEAD > symbols/COMMIT
          ls -la symbols
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-win64-symbols
          path: symbols/
          compression-level: 9
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-win64
          path: Binary/x64/

  macos:
    # arm64 desktop client so a second player on an Apple Silicon Mac (same
    # architecture as the AYN Thor) can netplay the Thor build. Netplay only
    # connects between identical Dolphin revisions, so this MUST come from the
    # same prepare/reconstruct as the Android APK in the same run -- release the
    # macOS .app and the APK from one workflow_dispatch as a matched pair.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    needs: prepare
    # macos-15 (Xcode 16 / Apple clang 16). macos-14's Apple clang 15 lacks
    # C++20 parenthesized aggregate initialization (P0960), which Dolphin's
    # HookableEvent relies on -- it fails to compile ControllerInterface.cpp.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Install deps
        # Qt6 + Ninja only. Deliberately NO ffmpeg: linking Homebrew's ffmpeg
        # would make the .app depend on dylibs the tester doesn't have (frame
        # dumping auto-disables when it's absent), same choice OrreLink made.
        run: brew install qt ninja
      - name: Configure
        # Flags mirror BuildMacOSUniversalBinary.py (proven) for a single arm64
        # build. USE_MGBA=ON keeps the integrated-GBA support XD needs;
        # ENABLE_AUTOUPDATE=OFF because this fork has no update server;
        # POSTPROCESS_BUNDLE=ON copies Qt into the .app so it is self-contained;
        # code signing stays at the default ad-hoc "-" identity.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_AUTOUPDATE=OFF \
            -DENABLE_TESTS=OFF \
            -DUSE_MGBA=ON \
            -DUSE_SYSTEM_LIBS=OFF \
            -DUSE_SYSTEM_ICONV=ON \
            -DUSE_SYSTEM_BZIP2=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DPOSTPROCESS_BUNDLE=ON \
            -DDISTRIBUTOR=xd-netplay
      - name: Build
        run: cmake --build build --target dolphin-emu
      - name: Package .app
        run: |
          # The bundle is OrreLink.app since the patch-106 rename (older
          # patch stacks produced DolphinQt.app; both spellings searched so a
          # bisect build still packages).
          APP="$(find build -name 'OrreLink.app' -type d 2>/dev/null | head -1)"
          if [ -z "$APP" ]; then APP="$(find build -name 'DolphinQt.app' -type d 2>/dev/null | head -1)"; fi
          if [ -z "$APP" ]; then APP="$(find build -name '*.app' -type d 2>/dev/null | head -1)"; fi
          if [ -z "$APP" ]; then echo "no .app produced; build/Binaries:" >&2; ls -la build/Binaries >&2 || true; exit 1; fi
          echo "Packaging $APP"
          mkdir -p out
          ditto -c -k --keepParent "$APP" "out/dolphin-xd-netplay-macos-arm64.zip"
          ls -la out
      - name: Collect symbols
        # crash_*.txt frames read OrreLink+0xOFFSET (offset from the image base);
        # 'nm -n' lists link-time addresses, which start at 0x100000000 on macOS
        # (__PAGEZERO), so look up 0x100000000 + OFFSET to find the function.
        run: |
          set -euo pipefail
          APP="$(find build -name 'OrreLink.app' -type d 2>/dev/null | head -1)"
          mkdir -p symbols
          nm -n "$APP/Contents/MacOS/OrreLink" > symbols/OrreLink.nm.txt
          git rev-parse HEAD > symbols/COMMIT
          wc -l symbols/OrreLink.nm.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-macos-symbols
          path: symbols/
          compression-level: 9
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-macos
          path: out/*.zip

  linux:
    # Same prepare/reconstruct as the others in the same run -- release as a
    # matched set or netplay's build-hash gate keeps platforms apart.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config libfuse2 \
            libasound2-dev libpulse-dev libbluetooth-dev libevdev-dev \
            libudev-dev libusb-1.0-0-dev libgl1-mesa-dev libxi-dev \
            libxrandr-dev libxkbcommon-x11-dev libxcb-cursor-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libgtk-3-dev
          pipx install aqtinstall
          aqt install-qt linux desktop 6.7.3 linux_gcc_64 -O "$HOME/qt"
          echo "QT_ROOT=$HOME/qt/6.7.3/gcc_64" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DLINUX_LOCAL_DEV=ON \
            -DENABLE_AUTOUPDATE=OFF \
            -DENABLE_TESTS=OFF \
            -DUSE_MGBA=ON \
            -DDISTRIBUTOR=xd-netplay
      - name: Build
        run: cmake --build build --target dolphin-emu
      - name: Package AppImage
        run: |
          set -euo pipefail
          BIN="$(find build/Binaries -maxdepth 1 -type f -perm -111 | head -1)"
          if [ -z "$BIN" ]; then echo "no binary produced" >&2; ls -la build/Binaries >&2; exit 1; fi
          BINNAME="$(basename "$BIN")"
          # Symbols for crash_*.txt (frames are <binary>+0xOFFSET): the pre-deploy
          # binary keeps its symbol table; 'nm -n' maps an offset to a function.
          mkdir -p symbols
          nm -n "$BIN" > "symbols/$BINNAME.nm.txt"
          cp "$BIN" "symbols/$BINNAME.unstripped"
          git rev-parse HEAD > symbols/COMMIT
          mkdir -p AppDir/usr/bin
          cp "$BIN" AppDir/usr/bin/
          # LINUX_LOCAL_DEV makes data lookups executable-relative: Sys rides
          # beside the binary inside the image.
          cp -r Data/Sys AppDir/usr/bin/Sys
          # Icon comes from the CI repo's main branch (this checkout is the
          # reconstructed Dolphin tree, which has no OrreLink art).
          curl -fsSL -o orrelink-icon.png \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/configs/orrelink-icon.png"
          cat > orrelink.desktop <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=OrreLink
          Exec=$BINNAME
          Icon=orrelink-icon
          Categories=Game;Emulator;
          DESKTOP
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$QT_ROOT/bin/qmake"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy --appdir AppDir \
            -e "AppDir/usr/bin/$BINNAME" \
            -d orrelink.desktop \
            -i orrelink-icon.png \
            --plugin qt \
            --output appimage
          mkdir -p out
          mv OrreLink*.AppImage out/ 2>/dev/null || mv *.AppImage out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-linux-symbols
          path: symbols/
          compression-level: 9
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-xd-netplay-linux
          path: out/
